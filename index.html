<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]{display:none!important}</style></head><body>
<title>Tests Caminos GVA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: columna única de lectura (máx. 720px), cabecera fija con tira de progreso tipo PK, una pregunta por pantalla */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#1b2329; --muted:#5d6a73; --line:#d7dde1;
  --accent:#0b5c8a; --accent-ink:#ffffff; --accent-soft:#e1eef6;
  --mark:#d98a00; --ok:#1f7a45; --ok-soft:#e2f2e8; --bad:#b3261e; --bad-soft:#fbe7e5; --blank:#8a949b;
  --f-display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171b; --surface:#192126; --fg:#e4e9ec; --muted:#97a3ab; --line:#2b363d;
  --accent:#4aa3d6; --accent-ink:#071218; --accent-soft:#16303f;
  --mark:#f0a92a; --ok:#5cc48a; --ok-soft:#173326; --bad:#ef7a70; --bad-soft:#3a1e1c; --blank:#7b868d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#192126; --fg:#e4e9ec; --muted:#97a3ab; --line:#2b363d;
  --accent:#4aa3d6; --accent-ink:#071218; --accent-soft:#16303f;
  --mark:#f0a92a; --ok:#5cc48a; --ok-soft:#173326; --bad:#ef7a70; --bad-soft:#3a1e1c; --blank:#7b868d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.top{padding-block:28px 8px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:34px;line-height:1.1}
.lead{color:var(--muted);margin:4px 0 0;max-width:60ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* menú */
.tests{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tcard h2{font-size:22px}
.tcard .norm{color:var(--muted);font-size:14px;margin:0}
.state{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.state b{color:var(--fg)}
/* quiz */
.qhead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.qhead .row{justify-content:space-between}
.qhead h2{font-size:18px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px}
.cell{height:26px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px;padding:0;color:var(--muted)}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.cell.skip{border-color:var(--mark);border-style:dashed;color:var(--mark)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qbody{padding-block:20px;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted)}
.enun{font-size:18px;line-height:1.55;margin:0;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-display);font-weight:700;font-size:18px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opt .t{min-width:0;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.done{cursor:default}
.opt.done:hover{border-color:var(--line)}
.opt.good,.opt.good:hover{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad,.opt.bad:hover{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.why b{color:var(--fg);font-weight:600}
.opt.good .why b{color:var(--ok)} .opt.bad .why b{color:var(--bad)}
.why .ref{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.verdict{margin:0;font-weight:600;font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--bad)}
.cell.ans.okc{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.ans.koc{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.skipped{background:var(--surface);border:1px dashed var(--mark);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.skipped .lab{font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--mark);color:var(--mark);background:transparent;border-radius:20px;padding:2px 10px;font-family:var(--f-mono);font-size:13px}
.confirm{background:var(--surface);border:1px solid var(--mark);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
/* resultados */
.score{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-top:16px}
.big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.nums{display:flex;flex-wrap:wrap;gap:18px;font-variant-numeric:tabular-nums}
.nums span{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.nums b{font-family:var(--f-display);font-size:26px}
.nums .o b{color:var(--ok)} .nums .x b{color:var(--bad)} .nums .bl b{color:var(--blank)}
.bar{height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.filters .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rlist{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ritem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blank);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ritem.ok{border-left-color:var(--ok)} .ritem.bad{border-left-color:var(--bad)}
.ritem .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ritem .res{font-weight:500}
.ritem.ok .res{color:var(--ok)} .ritem.bad .res{color:var(--bad)}
.ritem p{margin:0}
.ro{display:flex;flex-direction:column;gap:4px;font-size:15px}
.ro div{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:4px 6px;border-radius:4px}
.ro .k{font-family:var(--f-display);font-weight:700}
.ro .good{background:var(--ok-soft)} .ro .mine{background:var(--bad-soft)}
.just{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.just .ref{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.just ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.empty{color:var(--muted);padding:12px 0}
.note{font-size:13px;color:var(--muted);margin-top:24px}
@media (max-width:480px){.top h1{font-size:28px}.enun{font-size:17px}.big{font-size:44px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.cell{transition:border-color .15s,background .15s}}
</style>

<div class="wrap" id="app"></div>

<script>
let TESTS=[];
const LETTERS=["A","B","C","D"];
const KEY=id=>"tcgva_"+id;
const CACHE={};
function lsGet(id){try{return JSON.parse(localStorage.getItem(KEY(id))||"null")}catch(e){return null}}
function lsSet(id,s){try{if(s)localStorage.setItem(KEY(id),JSON.stringify(s));else localStorage.removeItem(KEY(id))}catch(e){}}
function load(id){if(!(id in CACHE)){const s=lsGet(id);if(s)CACHE[id]=s}const s=CACHE[id];return s?JSON.parse(JSON.stringify(s)):null}
function save(id,s){s.updatedAt=Date.now();CACHE[id]=JSON.parse(JSON.stringify(s));lsSet(id,s);}
function clearProgress(id){delete CACHE[id];lsSet(id,null);}
function fresh(t,subset){return{answers:{},skipped:[],cur:0,finished:false,subset:subset||t.preguntas.map(q=>q.n),history:null,filter:"fallos",confirm:false}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view={name:"menu",tid:null};
let st=null;
const app=document.getElementById("app");
const T=()=>TESTS.find(t=>t.id===view.tid);
const Q=(t,n)=>t.preguntas.find(q=>q.n===n);

function grade(t,s){let ok=0,bad=0,bl=0;s.subset.forEach(n=>{const a=s.answers[n];if(!a)bl++;else if(a===Q(t,n).c)ok++;else bad++});return{ok,bad,bl,tot:s.subset.length}}

function renderMenu(){
  app.innerHTML=`<header class="top"><span class="eyebrow">A1-04-03 · Ingeniería de Caminos, Canales y Puertos · GVA</span><h1>Tests de la parte específica</h1><p class="lead">Una pregunta por pantalla, como en el primer ejercicio. El progreso se guarda en este navegador; cada respuesta se corrige al momento, con la explicación de todas las opciones, y al final tienes la puntuación y el repaso de fallos.</p></header>
  <section class="tests">${TESTS.map(t=>{const s=load(t.id);let state="Sin empezar";let label="Empezar";
    if(s&&s.finished){const g=grade(t,s);state=`Corregido${s.subset.length<t.preguntas.length?" (repaso de fallos)":""}: <b>${g.ok}/${g.tot}</b> aciertos · ${g.bad} fallos · ${g.bl} en blanco`;label="Ver corrección"}
    else if(s){const n=Object.keys(s.answers).length;state=`En curso: <b>${n}/${s.subset.length}</b> respondidas · ${s.skipped.length} saltadas`;label="Continuar"}
    return `<article class="tcard"><span class="eyebrow">${t.preguntas.length} preguntas</span><h2>${esc(t.titulo)}</h2><p class="norm">${esc(t.normas)}</p><span class="state">${state}</span>
    <div class="row"><button class="btn primary" data-open="${t.id}">${label}</button>${s?`<button class="btn ${armed===t.id?"warn":"ghost"}" data-reset="${t.id}">${armed===t.id?"Pulsa otra vez para borrar el progreso":"Empezar de cero"}</button>`:""}</div></article>`}).join("")}</section>
  <section class="tcard" style="margin-top:20px"><h2 style="font-size:18px">Copia de seguridad del progreso</h2><p class="norm">El progreso se guarda en este navegador. Exporta una copia de vez en cuando o para pasarlo a otro dispositivo.</p><div class="row"><button class="btn" data-act="export">Exportar progreso</button><button class="btn" data-act="import">Importar progreso</button></div><span class="state" id="iomsg"></span></section><p class="note"><a href="validar.html">Validar un test nuevo antes de subirlo</a></p>${LOADERR?`<p class="note" style="color:var(--bad)">${esc(LOADERR)}</p>`:""}`;
}

function renderQuiz(){
  const t=T(),s=st,n=s.subset[s.cur],q=Q(t,n),a=s.answers[n];
  const answered=Object.keys(s.answers).filter(k=>s.subset.includes(+k)).length;
  const skipped=s.skipped.filter(x=>!s.answers[x]);
  app.innerHTML=`<div class="qhead"><div class="row"><h2>${esc(t.titulo)}${s.subset.length<t.preguntas.length?" · repaso":""}</h2><button class="btn ghost" data-act="menu">Menú</button></div>
   <div class="row"><span class="count">Pregunta ${s.cur+1} de ${s.subset.length} · ${answered} respondidas</span><button class="btn" data-act="finish">Corregir</button></div>
   <div class="strip">${s.subset.map((x,i)=>`<button class="cell ${s.answers[x]?"ans "+(s.answers[x]===Q(t,x).c?"okc":"koc"):skipped.includes(x)?"skip":""} ${i===s.cur?"cur":""}" data-go="${i}" aria-label="Pregunta ${x}">${x}</button>`).join("")}</div></div>
  ${s.confirm?`<div class="confirm" style="margin-top:14px"><p style="margin:0">Quedan <b>${s.subset.length-answered}</b> preguntas sin responder. Contarán como en blanco.</p><div class="row"><button class="btn primary" data-act="dofinish">Corregir igualmente</button><button class="btn" data-act="nofinish">Seguir respondiendo</button></div></div>`:""}
  <section class="qbody"><span class="tag">Pregunta ${n} · ${esc(q.tema)}</span><p class="enun">${esc(q.e)}</p>
   <div class="opts">${LETTERS.map(L=>a?`<div class="opt done ${L===q.c?"good":L===a?"bad":""}"><span class="l">${L}</span><span class="t">${esc(q.o[L])}<span class="why">${L===q.c?`<b>${L===a?"Correcta, has acertado.":"Esta es la correcta."}</b> <span class="ref">${esc(q.ref)}</span> ${esc(q.cita)}`:`<b>${L===a?"Tu respuesta: incorrecta.":"Incorrecta."}</b> ${esc(q.w[L])}`}</span></span></div>`:`<button class="opt" data-pick="${L}"><span class="l">${L}</span><span class="t">${esc(q.o[L])}</span></button>`).join("")}</div>
   ${a?`<p class="verdict ${a===q.c?"ok":"ko"}">${a===q.c?"✓ Correcta":`✗ Incorrecta: has marcado ${a}, la correcta es ${q.c}`}</p>`:""}
   <div class="nav"><button class="btn" data-act="prev" ${s.cur===0?"disabled":""}>Anterior</button>
   <div class="row">${a?"":`<button class="btn" data-act="skip">Saltar</button>`}<button class="btn primary" data-act="next">${s.cur===s.subset.length-1?"Ir a la primera":"Siguiente"}</button></div></div>
   ${skipped.length?`<div class="skipped"><span class="lab">Saltadas pendientes</span><div class="row">${skipped.map(x=>`<button class="chip" data-go="${s.subset.indexOf(x)}">${x}</button>`).join("")}</div></div>`:""}
  </section>`;
}

function renderResults(){
  const t=T(),s=st,g=grade(t,s),pct=Math.round(100*g.ok/g.tot);
  const items=s.subset.map(n=>{const q=Q(t,n),a=s.answers[n];return{q,a,k:!a?"bl":a===q.c?"ok":"bad"}});
  const f=s.filter;const shown=items.filter(i=>f==="todas"||(f==="fallos"?i.k!=="ok":i.k===f));
  app.innerHTML=`<header class="top"><span class="eyebrow">Corrección${s.subset.length<t.preguntas.length?" · repaso de fallos":""}</span><h1>${esc(t.titulo)}</h1></header>
  <section class="score"><div class="big">${g.ok}<small> / ${g.tot} aciertos · ${pct} %</small></div>
   <div class="bar"><i style="width:${100*g.ok/g.tot}%;background:var(--ok)"></i><i style="width:${100*g.bad/g.tot}%;background:var(--bad)"></i><i style="width:${100*g.bl/g.tot}%;background:var(--blank)"></i></div>
   <div class="nums"><span class="o"><b>${g.ok}</b>aciertos</span><span class="x"><b>${g.bad}</b>fallos</span><span class="bl"><b>${g.bl}</b>en blanco</span></div>
   <div class="row">${g.bad+g.bl?`<button class="btn primary" data-act="retry">Repetir solo fallos y en blanco (${g.bad+g.bl})</button>`:""}<button class="btn" data-act="restart">Repetir test completo</button><button class="btn ghost" data-act="menu">Menú</button></div></section>
  <div class="filters">${[["fallos","Fallos y en blanco"],["bad","Solo fallos"],["todas","Todas"]].map(([k,l])=>`<button class="btn ${f===k?"on":""}" data-filter="${k}">${l}</button>`).join("")}</div>
  <section class="rlist">${shown.length?shown.map(({q,a,k})=>`<article class="ritem ${k}"><div class="h"><span>Pregunta ${q.n} · ${esc(q.tema)}</span><span class="res">${k==="ok"?"Acierto":k==="bad"?`Fallo: marcaste ${a}, correcta ${q.c}`:`En blanco: correcta ${q.c}`}</span></div>
   <p>${esc(q.e)}</p>
   <div class="ro">${LETTERS.map(L=>`<div class="${L===q.c?"good":L===a?"mine":""}"><span class="k">${L}</span><span>${esc(q.o[L])}</span></div>`).join("")}</div>
   <div class="just"><span class="ref">Correcta ${q.c} · ${esc(q.ref)}</span><p>${esc(q.cita)}</p><ul>${LETTERS.filter(L=>L!==q.c).map(L=>`<li><b>${L}:</b> ${esc(q.w[L])}</li>`).join("")}</ul></div></article>`).join(""):`<p class="empty">Nada que mostrar con este filtro.</p>`}</section>`;
}

let armed=null;function confirmReset(id){if(armed===id){armed=null;return true}armed=id;render();return false}
function render(){ if(view.name==="menu")renderMenu(); else if(st.finished)renderResults(); else renderQuiz(); window.scrollTo(0,0)}
function persist(){save(view.tid,st)}
function open(id){view={name:"test",tid:id};st=load(id)||fresh(T());st.confirm=false;persist();render()}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.open){armed=null;return open(d.open)}
  if(d.reset){if(!confirmReset(d.reset))return;clearProgress(d.reset);return render()}
  if(d.go!==undefined){st.cur=+d.go;st.confirm=false;persist();return render()}
  if(d.pick){const n=st.subset[st.cur];if(st.answers[n])return;st.answers[n]=d.pick;st.skipped=st.skipped.filter(x=>x!==n);persist();return render()}
  if(d.filter){st.filter=d.filter;persist();return render()}
  if(d.act==="export"){exportProgress();return}
  if(d.act==="import"){importProgress();return}
  const n=st&&st.subset[st.cur];
  switch(d.act){
    case"menu":view={name:"menu",tid:null};return render();
    case"prev":st.cur=Math.max(0,st.cur-1);break;
    case"next":st.cur=(st.cur+1)%st.subset.length;break;
    case"skip":if(!st.skipped.includes(n))st.skipped.push(n);st.cur=(st.cur+1)%st.subset.length;break;
    case"clear":delete st.answers[n];break;
    case"finish":{const left=st.subset.filter(x=>!st.answers[x]).length;if(left){st.confirm=true;break}}
    case"dofinish":st.finished=true;st.confirm=false;st.filter="fallos";break;
    case"nofinish":st.confirm=false;break;
    case"retry":{const t=T();const sub=st.subset.filter(x=>st.answers[x]!==Q(t,x).c);st=fresh(t,sub);break}
    case"restart":st=fresh(T());break;
    default:return;
  }
  persist();render();
});
document.addEventListener("keydown",e=>{
  if(view.name!=="test"||st.finished||e.target.closest("input,textarea"))return;
  const k=e.key.toUpperCase();
  if(LETTERS.includes(k)){const n=st.subset[st.cur];if(st.answers[n])return;st.answers[n]=k;st.skipped=st.skipped.filter(x=>x!==n);persist();render()}
  else if(e.key==="ArrowRight"){st.cur=(st.cur+1)%st.subset.length;persist();render()}
  else if(e.key==="ArrowLeft"&&st.cur>0){st.cur--;persist();render()}
});
function exportProgress(){const out={};TESTS.forEach(t=>{const s=load(t.id);if(s)out[t.id]=s});
  const blob=new Blob([JSON.stringify({tipo:"progreso-tests-caminos",fecha:new Date().toISOString(),progreso:out},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="progreso-tests-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  msg("Copia descargada.")}
function importProgress(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());const p=d.progreso||{};let n=0;
    Object.keys(p).forEach(id=>{const cur=load(id);if(!cur||(p[id].updatedAt||0)>=(cur.updatedAt||0)){CACHE[id]=p[id];lsSet(id,p[id]);n++}});
    render();msg(n+" test(s) recuperados.")}catch(e){msg("El archivo no es una copia válida.")}};inp.click()}
function msg(t){const el=document.getElementById("iomsg");if(el)el.textContent=t}
let LOADERR="";
async function loadTests(){
  let files=[];
  try{const r=await fetch("tests/index.json",{cache:"no-store"});if(r.ok)files=(await r.json()).tests||[]}catch(e){}
  // Además, en GitHub Pages lista la carpeta tests/ para que basten con subir el archivo
  try{const host=location.hostname,parts=location.pathname.split("/").filter(Boolean);
    if(host.endsWith(".github.io")){const owner=host.split(".")[0];const repo=parts.length?parts[0]:host;
      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tests`);
      if(r.ok){(await r.json()).forEach(f=>{if(f.name.endsWith(".json")&&f.name!=="index.json"&&!files.includes(f.name))files.push(f.name)})}}}catch(e){}
  files.sort();const out=[],bad=[];
  for(const f of files){try{const r=await fetch("tests/"+f,{cache:"no-store"});const t=await r.json();
      if(t&&t.id&&Array.isArray(t.preguntas))out.push(t);else bad.push(f)}catch(e){bad.push(f)}}
  TESTS=out;if(bad.length)LOADERR="No se han podido leer: "+bad.join(", ");
  if(!out.length)LOADERR="No se ha encontrado ningún test en la carpeta tests/.";
  render()}
app.innerHTML='<p class="note">Cargando tests…</p>';
loadTests();
</script>
